name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

# read-only unless a job says otherwise (the tag release job does); every action pinned by commit (2026-09-24)
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test

  mac:
    name: App (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-v1
      - name: Core tests
        run: swift test
      - name: Bundle
        run: scripts/bundle.sh
      - name: What the binary links
        run: |
          otool -L dist/Nebula.app/Contents/MacOS/Nebula | head -40
          du -sh dist/Nebula.app dist/Nebula.dmg dist/Nebula-mac.zip
      - name: Smoke — a plain file over https
        run: dist/Nebula.app/Contents/MacOS/Nebula --smoke "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4" --seconds 3
      - name: Smoke — protected DASH, keys given
        run: dist/Nebula.app/Contents/MacOS/Nebula --smoke "https://storage.googleapis.com/shaka-demo-assets/angel-one-clearkey/dash.mpd" --keys abba271e8bcf552bbd2e86a434a9a5d9:69eaa802a6763af979e8d1940fb88392 --seconds 3
      - name: Smoke — HLS
        run: dist/Nebula.app/Contents/MacOS/Nebula --smoke "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" --seconds 3
      - name: Smoke — a live protected stream from the sports add-on, keys from its licence
        continue-on-error: true
        run: |
          B=https://sports.nebulapro.xyz/sports/i/free
          H=(-H "User-Agent: NebulaPlayer" -H "X-Nebula-Client: macos")
          ID=$(curl -s -m 30 "${H[@]}" "$B/catalog/sports/streamed-events-live-now.json" | python3 -c "import json,sys; m=json.load(sys.stdin).get('metas',[]); print(m[0]['id'] if m else '')")
          [ -z "$ID" ] && { echo "nothing live right now"; exit 0; }
          URL=$(curl -s -m 60 "${H[@]}" "$B/stream/sports/$ID.json" | python3 -c "import json,sys; s=[x['url'] for x in json.load(sys.stdin).get('streams',[]) if '.mpd' in x.get('url','')]; print(s[0] if s else '')")
          [ -z "$URL" ] && { echo "no protected card on $ID"; exit 0; }
          echo "through the app's manifest cache:"
          dist/Nebula.app/Contents/MacOS/Nebula --smoke "$URL" --seconds 4 | sed -E 's#private/[a-f0-9]+#private/…#g'
          echo "straight from the source, for comparison:"
          dist/Nebula.app/Contents/MacOS/Nebula --smoke "$URL" --seconds 4 --direct | sed -E 's#private/[a-f0-9]+#private/…#g'
      - name: Screens
        continue-on-error: true
        run: |
          mkdir -p shots "$RUNNER_TEMP/store"
          NEBULA_STORE_DIR="$RUNNER_TEMP/store" NEBULA_SHOTS_ADDON="https://sports.nebulapro.xyz/sports/i/free/manifest.json" \
          NEBULA_SHOTS_PLAY="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" NEBULA_MPV_DEBUG=0 \
            dist/Nebula.app/Contents/MacOS/Nebula --shots "$PWD/shots" &
          PID=$!
          for i in $(seq 1 150); do kill -0 $PID 2>/dev/null || break; sleep 2; done
          kill $PID 2>/dev/null || true
          ls -la shots
      # fatal: a link that opens a second window is the M14 regression, and it must turn the run red
      - name: Hand-off — a nebula:// link plays in the open window, not a second one
        run: |
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$PWD/dist/Nebula.app"
          cat > "$RUNNER_TEMP/windows.swift" <<'SWIFT'
          import CoreGraphics
          let pid = Int(CommandLine.arguments[1]) ?? 0
          let all = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] ?? []
          for w in all where (w[kCGWindowOwnerPID as String] as? Int) == pid && (w[kCGWindowLayer as String] as? Int) == 0 {
              print(w[kCGWindowNumber as String] as? Int ?? 0)
          }
          SWIFT
          swiftc -O -o "$RUNNER_TEMP/windows" "$RUNNER_TEMP/windows.swift"
          mkdir -p shots "$RUNNER_TEMP/store-handoff"
          NEBULA_STORE_DIR="$RUNNER_TEMP/store-handoff" dist/Nebula.app/Contents/MacOS/Nebula &
          PID=$!
          sleep 12
          echo "windows before the link: $("$RUNNER_TEMP/windows" $PID | grep -c . || true)"
          open "nebula://play?url=https%3A%2F%2Ftest-videos.co.uk%2Fvids%2Fbigbuckbunny%2Fmp4%2Fh264%2F360%2FBig_Buck_Bunny_360_10s_1MB.mp4&t=Hand-off"
          sleep 10
          IDS=$("$RUNNER_TEMP/windows" $PID)
          COUNT=$(echo "$IDS" | grep -c . || true)
          echo "windows after the link: $COUNT"
          for w in $IDS; do screencapture -x -o -l "$w" "shots/13-handoff-$w-screen.png" || true; done
          kill $PID 2>/dev/null || true
          test "$COUNT" = 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shots
          path: shots
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nebula-mac
          path: |
            dist/Nebula.dmg
            dist/Nebula-mac.zip

  ios:
    name: App (iPhone)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          brew install xcodegen
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-ios-${{ hashFiles('Package.swift', 'iOS/project.yml') }}-v1
      - name: Generate the project
        run: |
          cd iOS && xcodegen generate
          xcodebuild -project Nebula.xcodeproj -list
      - name: Build for a phone (unsigned — whoever installs it signs it)
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          xcodebuild -project iOS/Nebula.xcodeproj -scheme NebulaPhone \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -skipPackagePluginValidation \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER:-1}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > /tmp/xcb.log 2>&1 || { echo "=== errors ==="; grep -E "error:" /tmp/xcb.log | head -40; echo "=== tail ==="; tail -25 /tmp/xcb.log; exit 1; }
          echo "built $(grep -c "error:" /tmp/xcb.log || true) errors, $(grep -c "warning:" /tmp/xcb.log || true) warnings"
      - name: Wrap it as an .ipa
        run: |
          APP=build/Build/Products/Release-iphoneos/Nebula.app
          test -d "$APP"
          mkdir -p dist/Payload && cp -R "$APP" dist/Payload/
          ( cd dist && zip -qry Nebula.ipa Payload && rm -rf Payload )
          echo "what it links:"
          otool -L "$APP/Nebula" | head -30
          ls -la "$APP/Frameworks" 2>/dev/null || echo "(no embedded frameworks)"
          du -sh dist/Nebula.ipa
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nebula-ios
          path: dist/Nebula.ipa
      # Everything below runs on the simulator, the only place a phone build can be RUN here.
      # The build, the boot and the smokes are FATAL: they are all that stands between a crash in
      # the lock-screen code, the player's life cycle or the audio hand-back and a green run.
      # Only the screenshots may fail quietly.
      - name: Build for the simulator
        id: simbuild
        run: |
          xcodebuild -project iOS/Nebula.xcodeproj -scheme NebulaPhone \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build > /tmp/xcb-sim.log 2>&1 || { grep -E "error:" /tmp/xcb-sim.log | head -30; tail -20 /tmp/xcb-sim.log; exit 1; }
      - name: Boot a phone
        id: boot
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              for dev in d[rt]:
                  if dev.get('isAvailable') and dev['name'].startswith('iPhone'):
                      print(dev['udid']); sys.exit(0)
          sys.exit(1)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/Nebula.app
      - name: Smoke — the engine on a phone, no window
        run: |
          # each must print its one line AND say it played: no line (a crash, a hang) or any
          # other verdict fails the run, after all three have had their go
          run() {
            echo "--- $1"
            out=$(xcrun simctl launch --console-pty "$UDID" com.nebula.player.ios --args --smoke "$2" "${@:3}" 2>&1 | grep -E '^\{' || true)
            if [ -z "$out" ]; then echo "NO VERDICT: $1"; return 1; fi
            echo "$out"
            echo "$out" | grep -q '"verdict":"played"' || { echo "DID NOT PLAY: $1"; return 1; }
          }
          failed=0
          run "a plain file over https" "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4" --seconds 3 || failed=1
          run "protected DASH, keys given" "https://storage.googleapis.com/shaka-demo-assets/angel-one-clearkey/dash.mpd" --keys abba271e8bcf552bbd2e86a434a9a5d9:69eaa802a6763af979e8d1940fb88392 --seconds 3 || failed=1
          run "HLS" "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" --seconds 3 || failed=1
          exit $failed
      - name: Screens
        continue-on-error: true
        run: |
          mkdir -p shots
          # "${@:2}" quoted: bare, `--title "Test stream"` reached the app as two words
          shot() {
            xcrun simctl terminate "$UDID" com.nebula.player.ios 2>/dev/null || true
            xcrun simctl launch "$UDID" com.nebula.player.ios --args "${@:2}" >/dev/null
            sleep "${SETTLE:-9}"
            xcrun simctl io "$UDID" screenshot "shots/$1.png"
          }
          shot home --tab home --addon "https://sports.nebulapro.xyz/sports/i/free/manifest.json"
          shot addons --tab addons
          shot settings --tab settings
          shot search --tab search
          # the pages under the full-bleed art, where the hero's width bug lived
          SETTLE=14 shot film --tab home --page film
          SETTLE=14 shot series --tab home --page series
          SETTLE=16 shot streams --tab home --page streams
          # the reader's own larger text size (Dynamic Type), then back to the default
          xcrun simctl ui "$UDID" content_size extra-extra-extra-large || true
          SETTLE=14 shot series-larger-text --tab home --page series
          SETTLE=12 shot home-larger-text --tab home
          xcrun simctl ui "$UDID" content_size large || true
          SETTLE=16 shot player --play "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" --title "Test stream"
          # again with the controls pinned up, so the chrome itself can be looked at
          export SIMCTL_CHILD_NEBULA_KEEP_CHROME=1
          SETTLE=16 shot player-chrome --play "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" --title "Test stream"
          unset SIMCTL_CHILD_NEBULA_KEEP_CHROME
          ls -la shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: shots-ios
          path: shots
          if-no-files-found: warn


  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, mac, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Nebula-mac
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Nebula-ios
          path: dist
      - name: The tag names the version being built
        run: |
          # the apps read their version from VERSION; a tag that disagrees would publish a
          # release whose files call themselves something else
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" || { echo "tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
      - name: Cut the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/Nebula.dmg dist/Nebula-mac.zip dist/Nebula.ipa --title "Nebula for Mac and iPhone $TAG" --notes-file RELEASE_NOTES.md
