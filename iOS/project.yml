# The iPhone app's Xcode project, generated by XcodeGen on the build machine (`xcodegen` in
# iOS/). There is no .xcodeproj in the repo on purpose: it would be a second, hand-edited copy of
# the file list, and nobody here has a Mac to fix it on.
#
# The app is the same sources as the Mac's, minus the six files that are AppKit to the core, plus
# the phone shell in Sources/NebulaIOS.
name: Nebula
options:
  bundleIdPrefix: com.nebula.player
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: none

packages:
  Nebula:
    path: ..
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0

targets:
  # NOT "Nebula": the package next door exports an executable product by that name, and
  # `xcodebuild -scheme Nebula` resolves to THAT — it built the Mac app, AppKit and all, against
  # the iOS SDK. The app it produces is still Nebula.app (PRODUCT_NAME below).
  NebulaPhone:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/NebulaIOS
      - path: ../Sources/Nebula
        excludes:
          # the Mac's own shell: its window, its menu bar, its pointer and its screenshot rigs
          - "main.swift"
          - "Views/RootView.swift"
          - "Player/PlayerScreen.swift"
          - "Player/VideoSurface.swift"
          - "Support/IconMaker.swift"
          - "Support/Shots.swift"
      # a folder reference, so the art lands at <app>/badges where StreamBadges looks for it
      - path: ../Resources/badges
        type: folder
      - path: Assets.xcassets
    dependencies:
      - package: Nebula
        product: NebulaCore
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_NAME: Nebula
        PRODUCT_BUNDLE_IDENTIFIER: com.nebula.player.ios
        INFOPLIST_FILE: ../Resources/iOS/Info.plist
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # nobody here has an Apple developer account: the .ipa ships unsigned and whoever
        # installs it signs it with their own free Apple ID (README says how)
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: ""

# XcodeGen does not make a scheme unless one is asked for, and xcodebuild needs one by name. The
# first run only found "Nebula" because the Swift package exports schemes for ITS products.
schemes:
  NebulaPhone:
    build:
      targets:
        NebulaPhone: all
    run:
      config: Debug
    archive:
      config: Release
